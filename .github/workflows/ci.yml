name: CI

# Pre-launch hardening gate: build + size-ceiling + tests + complete Slither parsing.
# Analyzer findings need review; they do not themselves fail CI. Keeps the regression net running on every
# change so nothing silently regresses before the C4A contest.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly (Mon 06:00 UTC) strong-but-slow guarantees that per-PR CI skips:
    # Halmos symbolic proofs + the deep-profile invariant sweep. A proof that
    # regresses fails this run instead of silently shipping green.
    - cron: '0 6 * * 1'

concurrency:
  # A normal push must not cancel a long manual/scheduled audit campaign.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Match the toolchain used for the audit regression, cold-gas and deep campaigns.
  AUDIT_FOUNDRY_VERSION: nightly-c07d504b4ae67754584f4e05ff0c547a43c50f7b

jobs:
  foundry-build:
    name: Production build + assurance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit snapshot identity
        run: make check-audit-snapshot

      # via-IR + optimizer_runs=1000 over the full protocol peaks above the ~7GB
      # hosted-runner RAM, so forge build was being OOM-killed (exit 143) mid-compile.
      # Add swap to give the compile headroom; it slows but no longer dies.
      - name: Add swap space (via-IR build headroom)
        run: |
          # The hosted runner ships an active /swapfile (~4G); disable and replace
          # it with a larger one so via-IR doesn't OOM-kill forge build (exit 143).
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 14G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=14336
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}

      - name: Install npm deps (OpenZeppelin, etc.)
        run: npm ci

      - name: Deployment configuration regression tests
        run: npx mocha test/deploy/OptionalConfig.test.js

      - name: Build production contracts
        run: forge build --skip test --threads 4 --out forge-out-production --cache-path .foundry-cache-production

      # The recipient-call gate self-tests need the pinned solc binary, installed
      # in ~/.svm by the production build above; Foundry alone does not install it.
      - name: Assurance runner and source-gate tests
        run: make test-assurance-tools

      - name: Contract size ceilings (EIP-170, 24,576 runtime / 49,152 initcode)
        run: node scripts/check-deployment-sizes.js --schedule eip170 forge-out-production

      - name: Owner and Vault player action coverage
        run: |
          node scripts/check-owner-actions.js forge-out-production
          node scripts/check-owner-governance-layout.js forge-out-production
          node scripts/check-vault-player-actions.js forge-out-production

      # MECH-02: deterministic storage-layout gate. Fails the PR if any slot/offset
      # in DegenerusGame, a state contract, or a delegatecall module moves vs the
      # committed golden. Recursive comparison also checks nested structs across
      # every module and the separate CrapsBattle/JackpotBattle delegate pair.
      - name: Storage-layout oracle (MECH-02)
        env:
          CHECK_ARTIFACTS: forge-out-production
          FOUNDRY_OUT: forge-out-production
          FOUNDRY_CACHE_PATH: .foundry-cache-production
        run: bash scripts/layout/storage_layout_oracle.sh

      - name: Recursive delegate storage layouts
        run: python3 scripts/layout/check_recursive_layout.py --out forge-out-production --report .audit-test-logs/foundry/recursive-layout.json

      # Run all source-drift gates, including the newer crank, randomness,
      # shared-storage, arithmetic and simulation parity registries.
      - name: Source-drift gates
        run: make CHECK_ARTIFACTS=forge-out-production check-interfaces check-delegatecall check-raw-selectors check-rng-window check-pool-writes check-array-delete check-advance-calls check-rng-taint check-rng-shape check-unchecked check-write-owners check-gasleft check-memory-guard check-recipient-calls

      # Cross-profile storage identity. Regenerates the glamsterdam profile files, builds the
      # production contracts only (contracts/; the test helpers target the default profile), then
      # runs both layout gates on that build. The recursive check's --baseline compares every
      # contract layout the two builds share (DegenerusGame, every Game and Craps delegate,
      # Coinflip and the standalone state contracts) with the eip170 build above and fails on
      # any difference. Last in the job: the working tree stays on glamsterdam afterwards.
      - name: Glamsterdam profile layout identity
        env:
          PROFILE: glamsterdam
        run: |
          node scripts/select-profile.js
          node scripts/select-profile.js --check
          forge build contracts --skip test --threads 4 --out forge-out-glamsterdam --cache-path .foundry-cache-glamsterdam
          CHECK_ARTIFACTS=forge-out-glamsterdam bash scripts/layout/storage_layout_oracle.sh
          python3 scripts/layout/check_recursive_layout.py --out forge-out-glamsterdam --baseline forge-out-production --report .audit-test-logs/foundry/recursive-layout-glamsterdam.json

      - name: Preserve structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-structural-evidence
          path: .audit-test-logs/foundry/
          include-hidden-files: true
          if-no-files-found: ignore

  foundry-tests:
    name: Foundry ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Each group has its own hosted VM. Start all seven so the long cold and
      # invariant campaigns do not wait behind unrelated fuzz compilations.
      max-parallel: 7
      matrix:
        group: [repro-symbolic, fuzz-1, fuzz-2, fuzz-3, fuzz-4, invariants-1, invariants-2, invariants-3, integration-gas]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}
      - run: npm ci
      - name: Add swap space for bounded via-IR compilations
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 14G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=14336
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      - name: Run complete selected group
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          # Keep resource evidence visible even if the hosted runner is terminated
          # before upload-artifact can run. This does not alter test budgets.
          mkdir -p .audit-test-logs/foundry
          (
            while true; do
              date -u '+%Y-%m-%dT%H:%M:%SZ'
              free -h
              df -h . /tmp
              ps -eo pid,ppid,comm,etime,%cpu,rss --sort=-rss | head -12
              for resource_file in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.peak; do
                if [ -r "$resource_file" ]; then
                  echo "$resource_file"
                  cat "$resource_file"
                fi
              done
              sleep 60
            done
          ) > >(tee -a .audit-test-logs/foundry/runner-resources.log) 2>&1 &
          resource_monitor_pid=$!
          trap 'kill "$resource_monitor_pid" 2>/dev/null || true; wait "$resource_monitor_pid" 2>/dev/null || true' EXIT
          if [ "$TEST_GROUP" = integration-gas ]; then
            FOUNDRY_ISOLATE=true python3 scripts/test-foundry-groups.py --group "$TEST_GROUP" --max-files 5 --threads 1
          else
            FOUNDRY_ISOLATE=false python3 scripts/test-foundry-groups.py --group "$TEST_GROUP" --max-files 5 --threads 1
          fi
      - name: Preserve group evidence, including failed batches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-${{ matrix.group }}-evidence
          path: .audit-test-logs/foundry/
          include-hidden-files: true
          if-no-files-found: ignore

  # The protocol against the REAL mainnet dependencies (Lido stETH and the Chainlink VRF v2.5
  # coordinator) on a fork pinned at test/fork/ForkPins.sol's FORK_BLOCK. Not part
  # of the matrix above: those groups build with mock pins and no RPC; this one builds with the
  # fork patch (scripts/lib/patchForFork.js) and needs archive state at the pinned block.
  foundry-fork:
    name: Foundry mainnet fork (real Lido / Chainlink)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}
          # The fork-state cache is managed below, keyed by the pinned block.
          cache: false
      - run: npm ci
      - name: Add swap space for the via-IR compilation
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 14G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=14336
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      - name: Read the pinned fork block
        id: pin
        run: |
          block=$(sed -n 's/.*constant FORK_BLOCK = \([0-9]*\);.*/\1/p' test/fork/ForkPins.sol)
          test -n "$block"
          echo "block=$block" >> "$GITHUB_OUTPUT"
      # Foundry stores every account/slot it fetched for a pinned fork under
      # ~/.foundry/cache/rpc/mainnet/<block>. State at a fixed block never changes, so a cache
      # keyed by the block (plus the suite, which decides WHAT is fetched) makes reruns nearly
      # RPC-free; a changed suite restores the same block's cache and only fetches the delta.
      - name: Restore fork RPC cache
        uses: actions/cache@v4
        with:
          path: ~/.foundry/cache/rpc/mainnet/${{ steps.pin.outputs.block }}
          key: foundry-fork-rpc-${{ steps.pin.outputs.block }}-${{ hashFiles('test/fork/**', 'contracts/**') }}
          restore-keys: |
            foundry-fork-rpc-${{ steps.pin.outputs.block }}-
      - name: Mainnet-fork suite
        env:
          # A repository secret when configured; empty on forks and when unset.
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          FORK_BLOCK: ${{ steps.pin.outputs.block }}
        run: |
          # Use the first endpoint that serves archive state at the pinned block: the secret, then
          # keyless public endpoints. The probe reads stETH's balance AT the block, so an endpoint
          # that prunes old state (1rpc.io refuses archive reads once the pin is ~128 blocks old)
          # is skipped rather than failing the suite mid-run.
          probe() {
            curl -sf -m 30 -X POST -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getBalance\",\"params\":[\"0xae7ab96520DE3A18E5e111B5EaAb095312D7fE84\",\"$(printf '0x%x' "$FORK_BLOCK")\"]}" \
              "$1" | grep -q '"result":"0x'
          }
          selected=""
          for candidate in "$MAINNET_RPC_URL" https://eth.drpc.org https://1rpc.io/eth \
              https://mainnet.gateway.tenderly.co https://eth-pokt.nodies.app; do
            if [ -n "$candidate" ] && probe "$candidate"; then selected="$candidate"; break; fi
          done
          if [ -z "$selected" ]; then
            echo "::error::No RPC endpoint served archive state at block $FORK_BLOCK"
            exit 1
          fi
          if [ "$selected" = "$MAINNET_RPC_URL" ]; then echo "Using the MAINNET_RPC_URL secret"; else echo "Using $selected"; fi
          export MAINNET_RPC_URL="$selected"
          mkdir -p .audit-test-logs/foundry
          # Budget and subscriber-admission probes require cold isolated calls;
          # the remaining fork suites keep the non-isolated runner.
          plain=()
          for file in test/fork/*.t.sol; do
            case "$file" in
              test/fork/ForkGlamsterdamBudgets.t.sol|test/fork/SubscriberAdmissionRecoveryFork.t.sol) ;;
              *) plain+=(--file "$file") ;;
            esac
          done
          status=0
          FOUNDRY_ISOLATE=false python3 scripts/test-foundry-groups.py "${plain[@]}" --threads 2 || status=1
          FOUNDRY_ISOLATE=true python3 scripts/test-foundry-groups.py \
            --file test/fork/ForkGlamsterdamBudgets.t.sol \
            --file test/fork/SubscriberAdmissionRecoveryFork.t.sol --threads 2 || status=1
          exit $status
      # The runner redacts each finished batch, but a cancelled or timed-out run can leave a raw
      # log behind, and uploaded artifacts are not secret-masked: scrub every file before upload.
      - name: Redact the RPC secret from fork evidence
        if: always()
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          [ -n "$MAINNET_RPC_URL" ] && [ -d .audit-test-logs ] || exit 0
          python3 - <<'PYTHON'
          import importlib.util, os, pathlib
          spec = importlib.util.spec_from_file_location("runner", "scripts/test-foundry-groups.py")
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          url = os.environ["MAINNET_RPC_URL"]
          for path in pathlib.Path(".audit-test-logs").rglob("*"):
              if path.is_file():
                  text = path.read_text(errors="replace")
                  clean = runner.redact_rpc_url(text, url)
                  if clean != text:
                      path.write_text(clean)
          PYTHON
      - name: Preserve fork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-fork-evidence
          path: .audit-test-logs/foundry/
          include-hidden-files: true
          if-no-files-found: ignore

  foundry:
    name: Foundry build + tests
    needs: [foundry-build, foundry-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every build gate and test group
        env:
          BUILD_RESULT: ${{ needs.foundry-build.result }}
          TEST_RESULT: ${{ needs.foundry-tests.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success

  hardhat:
    name: Hardhat tests in bounded batches
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}
      - run: npm ci
      - name: Install Python Keccak reference dependency
        run: python3 -m pip install safe-pysha3==1.0.5
      - name: Full configured Hardhat selection
        env:
          # Test harnesses deploy initcode above the EIP-3860 cap; production sizes are gated above.
          CONSOLIDATION_CANDIDATE: 'true'
        run: python3 scripts/test-hardhat-groups.py
      - name: Preserve Hardhat evidence, including failed batches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardhat-evidence
          path: .audit-test-logs/hardhat/
          include-hidden-files: true
          if-no-files-found: ignore

  slither:
    name: Slither integrity and detector report
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}
      - run: npm ci
      - run: python3 -m pip install slither-analyzer==0.11.5
      - name: Add swap space for compiler and analysis
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 14G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=14336
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      - name: Fresh production build with complete compiler inputs
        run: forge build --skip test --build-info --force --out forge-out-slither --cache-path .foundry-cache-slither
      - name: Require complete parsing and SlithIR
        run: |
          mkdir -p .audit-test-logs/slither
          python3 scripts/check-slither.py forge-out-slither > .audit-test-logs/slither/integrity.json
      - name: Detector report (findings require review)
        continue-on-error: true
        timeout-minutes: 200
        run: |
          slither . --compile-force-framework foundry --ignore-compile \
            --foundry-out-directory forge-out-slither --fail-none \
            --exclude-informational --exclude-optimization \
            --json .audit-test-logs/slither/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-evidence
          path: .audit-test-logs/slither/
          include-hidden-files: true
          if-no-files-found: ignore

  aderyn:
    name: Aderyn (static analysis, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}
      - run: npm ci
      - name: Install Aderyn
        # crates.io still serves 0.1.9, which rejects the pinned Osaka EVM.
        # Use the same supported release as the local audit campaign.
        run: |
          npm install --global @cyfrin/aderyn@0.6.8
          aderyn --version
      - name: Run Aderyn
        run: aderyn . -o aderyn-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aderyn-report
          path: aderyn-report.md
          if-no-files-found: ignore

  # Strong-but-slow guarantees the per-PR gate skips: the configured Halmos symbolic checks
  # and the deep-profile invariant sweep (runs=1000/depth=256, ~8x the per-PR budget).
  # Runs on the weekly schedule and on manual dispatch — a proof or deep invariant that
  # regresses fails here instead of silently shipping green. The local mutation
  # campaign is not part of this CI job or the supplied verification guarantee.
  deep-guarantees:
    name: Halmos proofs (scheduled / manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install npm deps (OpenZeppelin, etc.)
        run: npm ci
      - name: Install Halmos
        run: pip install halmos==0.3.3
      - name: Exact split arithmetic proofs and gate sensitivity
        run: |
          python3 scripts/test-split-arithmetic.py
          python3 scripts/check-split-arithmetic.py --json-output .audit-test-logs/halmos/split-arithmetic.json
      - name: Configure deterministic Foundry deployment addresses
        run: node scripts/lib/patchForFoundry.js
      - name: Halmos symbolic proofs
        env:
          # Halmos pins and verifies checksums for its supported solver downloads.
          HALMOS_ALLOW_DOWNLOAD: '1'
        run: |
          set -o pipefail
          mkdir -p .audit-test-logs/halmos
          FOUNDRY_PROFILE=halmos halmos --forge-build-out forge-out-halmos --loop 8 --panic-error-codes '*' --solver-timeout-assertion 300000 --solver-threads 2 --json-output .audit-test-logs/halmos/results.json --dump-smt-queries --dump-smt-directory .audit-test-logs/halmos/queries 2>&1 | tee .audit-test-logs/halmos/output.log
      - name: Preserve symbolic evidence, including unresolved queries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halmos-evidence
          path: .audit-test-logs/halmos/
          include-hidden-files: true
          if-no-files-found: ignore

  deep-selection:
    name: Discover deep invariant partitions
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      partitions: ${{ steps.discover.outputs.partitions }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify partition coverage
        run: python3 scripts/test-deep-invariant-matrix.py
      - name: Enumerate every invariant root and heavy property
        id: discover
        run: |
          python3 - <<'PYTHON'
          import os, subprocess
          partitions = subprocess.check_output(["python3", "scripts/deep-invariant-matrix.py"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("partitions=" + partitions + "\n")
          PYTHON

  deep-lifecycles:
    name: Deep lifecycle / ${{ matrix.label }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mature-composition
            file: test/repro/MatureComposition.t.sol
            profile: deep
            isolate: 'false'
            multiplier: '10000'
          - label: paid-minimum
            file: test/gas/NativePaidLifecycle.t.sol
            profile: default
            isolate: 'true'
            multiplier: '2500'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}
      - run: npm ci
      - name: Verify composed or minimum-calibration lifecycle
        env:
          LIFECYCLE_FILE: ${{ matrix.file }}
          FOUNDRY_PROFILE: ${{ matrix.profile }}
          FOUNDRY_ISOLATE: ${{ matrix.isolate }}
          NATIVE_PAID_MULTIPLIER: ${{ matrix.multiplier }}
          FOUNDRY_FUZZ_SEED: ${{ github.run_id }}
        run: python3 scripts/test-foundry-groups.py --file "$LIFECYCLE_FILE" --threads 1
      - name: Preserve lifecycle evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-lifecycle-${{ matrix.label }}-evidence
          path: .audit-test-logs/foundry/
          include-hidden-files: true
          if-no-files-found: ignore

  deep-invariants:
    name: Deep ${{ matrix.file }} / ${{ matrix.label }}
    needs: deep-selection
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.deep-selection.outputs.partitions) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}
      - run: npm ci
      - name: Deep invariant partition (runs=1000 / depth=256, existing suite overrides retained)
        env:
          INVARIANT_FILE: ${{ matrix.file }}
          INVARIANT_MATCH: ${{ matrix.match }}
          INVARIANT_EXCLUDE: ${{ matrix.exclude }}
          # A fresh seed every scheduled run (the per-PR jobs keep the fixed profile seed). Replay a
          # failure locally with FOUNDRY_PROFILE=deep FOUNDRY_FUZZ_SEED=<seed printed below>.
          FOUNDRY_FUZZ_SEED: ${{ github.run_id }}
        run: |
          echo "deep invariant seed: $FOUNDRY_FUZZ_SEED"
          FOUNDRY_PROFILE=deep FOUNDRY_ISOLATE=false python3 scripts/test-foundry-groups.py --file "$INVARIANT_FILE" --match-test "$INVARIANT_MATCH" --no-match-test "$INVARIANT_EXCLUDE" --threads 1
      - name: Preserve deep-invariant evidence, including failed batches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-invariant-${{ strategy.job-index }}-evidence
          path: .audit-test-logs/foundry/
          include-hidden-files: true
          if-no-files-found: ignore

name: CI

# Pre-launch hardening gate: build + size-ceiling + tests, plus non-blocking
# static analysis (Slither + Aderyn). Keeps the regression net running on every
# change so nothing silently regresses before the C4A contest.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly (Mon 06:00 UTC) strong-but-slow guarantees that per-PR CI skips:
    # Halmos symbolic proofs + the deep-profile invariant sweep. A proof that
    # regresses fails this run instead of silently shipping green.
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the toolchain used for the audit regression, cold-gas and deep campaigns.
  AUDIT_FOUNDRY_VERSION: nightly-c07d504b4ae67754584f4e05ff0c547a43c50f7b

jobs:
  foundry-build:
    name: Production build + assurance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Audit snapshot identity and assurance runner tests
        run: make check-audit-snapshot test-assurance-tools

      # via-IR + optimizer_runs=1000 over the full protocol peaks above the ~7GB
      # hosted-runner RAM, so forge build was being OOM-killed (exit 143) mid-compile.
      # Add swap to give the compile headroom; it slows but no longer dies.
      - name: Add swap space (via-IR build headroom)
        run: |
          # The hosted runner ships an active /swapfile (~4G); disable and replace
          # it with a larger one so via-IR doesn't OOM-kill forge build (exit 143).
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 14G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=14336
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}

      - name: Install npm deps (OpenZeppelin, etc.)
        run: npm ci

      - name: Deployment configuration regression tests
        run: npx mocha test/deploy/OptionalConfig.test.js

      - name: Build production contracts
        run: forge build --skip test --out forge-out-production --cache-path .foundry-cache-production

      - name: Contract size ceiling (EIP-170)
        run: node scripts/check-deployment-sizes.js forge-out-production

      # MECH-02: deterministic storage-layout gate. Fails the PR if any slot/offset
      # in DegenerusGame, a state contract, or a delegatecall module moves vs the
      # committed golden. Recursive comparison also checks nested structs across
      # every module and the separate CrapsBattle/JackpotBattle delegate pair.
      - name: Storage-layout oracle (MECH-02)
        env:
          FOUNDRY_OUT: forge-out-production
          FOUNDRY_CACHE_PATH: .foundry-cache-production
        run: bash scripts/layout/storage_layout_oracle.sh

      - name: Recursive delegate storage layouts
        run: python3 scripts/layout/check_recursive_layout.py --out forge-out-production --report .audit-test-logs/foundry/recursive-layout.json

      # Run all source-drift gates, including the newer crank, randomness,
      # shared-storage, arithmetic and simulation parity registries.
      - name: Source-drift gates
        run: make check-interfaces check-delegatecall check-raw-selectors check-rng-window check-pool-writes check-array-delete check-advance-calls check-rng-taint check-unchecked check-write-owners check-gasleft

      - name: Preserve structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-structural-evidence
          path: .audit-test-logs/foundry/
          include-hidden-files: true
          if-no-files-found: ignore

  foundry-tests:
    name: Foundry ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Each group has its own hosted VM. Start all seven so the long cold and
      # invariant campaigns do not wait behind unrelated fuzz compilations.
      max-parallel: 7
      matrix:
        group: [repro-symbolic, fuzz-1, fuzz-2, fuzz-3, fuzz-4, invariants, integration-gas]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}
      - run: npm ci
      - name: Add swap space for bounded via-IR compilations
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 14G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=14336
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      - name: Run complete selected group
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          # Keep resource evidence visible even if the hosted runner is terminated
          # before upload-artifact can run. This does not alter test budgets.
          mkdir -p .audit-test-logs/foundry
          (
            while true; do
              date -u '+%Y-%m-%dT%H:%M:%SZ'
              free -h
              df -h . /tmp
              ps -eo pid,ppid,comm,etime,%cpu,rss --sort=-rss | head -12
              for resource_file in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.peak; do
                if [ -r "$resource_file" ]; then
                  echo "$resource_file"
                  cat "$resource_file"
                fi
              done
              sleep 60
            done
          ) > >(tee -a .audit-test-logs/foundry/runner-resources.log) 2>&1 &
          resource_monitor_pid=$!
          trap 'kill "$resource_monitor_pid" 2>/dev/null || true; wait "$resource_monitor_pid" 2>/dev/null || true' EXIT
          if [ "$TEST_GROUP" = integration-gas ]; then
            FOUNDRY_ISOLATE=true python3 scripts/test-foundry-groups.py --group "$TEST_GROUP" --max-files 5 --threads 1
          else
            FOUNDRY_ISOLATE=false python3 scripts/test-foundry-groups.py --group "$TEST_GROUP" --max-files 5 --threads 1
          fi
      - name: Preserve group evidence, including failed batches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-${{ matrix.group }}-evidence
          path: .audit-test-logs/foundry/
          include-hidden-files: true
          if-no-files-found: ignore

  foundry:
    name: Foundry build + tests
    needs: [foundry-build, foundry-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every build gate and test group
        env:
          BUILD_RESULT: ${{ needs.foundry-build.result }}
          TEST_RESULT: ${{ needs.foundry-tests.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success

  hardhat:
    name: Hardhat tests in bounded batches
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}
      - run: npm ci
      - name: Full configured Hardhat selection
        run: python3 scripts/test-hardhat-groups.py
      - name: Preserve Hardhat evidence, including failed batches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardhat-evidence
          path: .audit-test-logs/hardhat/
          include-hidden-files: true
          if-no-files-found: ignore

  slither:
    name: Slither (static analysis, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}
      - run: npm ci
      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          fail-on: none
          slither-args: --exclude-informational --exclude-optimization

  aderyn:
    name: Aderyn (static analysis, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}
      - run: npm ci
      - name: Install Aderyn
        # crates.io still serves 0.1.9, which rejects the pinned Osaka EVM.
        # Use the same supported release as the local audit campaign.
        run: |
          npm install --global @cyfrin/aderyn@0.6.8
          aderyn --version
      - name: Run Aderyn
        run: aderyn . -o aderyn-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aderyn-report
          path: aderyn-report.md
          if-no-files-found: ignore

  # Strong-but-slow guarantees the per-PR gate skips: the configured Halmos symbolic checks
  # and the deep-profile invariant sweep (runs=1000/depth=256, ~8x the per-PR budget).
  # Runs on the weekly schedule and on manual dispatch — a proof or deep invariant that
  # regresses fails here instead of silently shipping green. The local mutation
  # campaign is not part of this CI job or the supplied verification guarantee.
  deep-guarantees:
    name: Halmos proofs (scheduled / manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install npm deps (OpenZeppelin, etc.)
        run: npm ci
      - name: Install Halmos
        run: pip install halmos==0.3.3
      - name: Exact split arithmetic proofs and gate sensitivity
        run: |
          python3 scripts/test-split-arithmetic.py
          python3 scripts/check-split-arithmetic.py --json-output .audit-test-logs/halmos/split-arithmetic.json
      - name: Configure deterministic Foundry deployment addresses
        run: node scripts/lib/patchForFoundry.js
      - name: Halmos symbolic proofs
        env:
          # Halmos pins and verifies checksums for its supported solver downloads.
          HALMOS_ALLOW_DOWNLOAD: '1'
        run: |
          set -o pipefail
          mkdir -p .audit-test-logs/halmos
          FOUNDRY_PROFILE=halmos halmos --forge-build-out forge-out-halmos --loop 8 --panic-error-codes '*' --solver-timeout-assertion 120000 --solver-threads 2 --json-output .audit-test-logs/halmos/results.json --dump-smt-queries --dump-smt-directory .audit-test-logs/halmos/queries 2>&1 | tee .audit-test-logs/halmos/output.log
      - name: Preserve symbolic evidence, including unresolved queries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halmos-evidence
          path: .audit-test-logs/halmos/
          include-hidden-files: true
          if-no-files-found: ignore

  deep-selection:
    name: Discover deep invariant partitions
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      partitions: ${{ steps.discover.outputs.partitions }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify partition coverage
        run: python3 scripts/test-deep-invariant-matrix.py
      - name: Enumerate every invariant root and heavy property
        id: discover
        run: |
          python3 - <<'PYTHON'
          import os, subprocess
          partitions = subprocess.check_output(["python3", "scripts/deep-invariant-matrix.py"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("partitions=" + partitions + "\n")
          PYTHON

  deep-invariants:
    name: Deep ${{ matrix.file }} / ${{ matrix.label }}
    needs: deep-selection
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.deep-selection.outputs.partitions) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.AUDIT_FOUNDRY_VERSION }}
      - run: npm ci
      - name: Deep invariant partition (runs=1000 / depth=256, existing suite overrides retained)
        env:
          INVARIANT_FILE: ${{ matrix.file }}
          INVARIANT_MATCH: ${{ matrix.match }}
          INVARIANT_EXCLUDE: ${{ matrix.exclude }}
        run: FOUNDRY_PROFILE=deep FOUNDRY_ISOLATE=false python3 scripts/test-foundry-groups.py --file "$INVARIANT_FILE" --match-test "$INVARIANT_MATCH" --no-match-test "$INVARIANT_EXCLUDE" --threads 1
      - name: Preserve deep-invariant evidence, including failed batches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-invariant-${{ strategy.job-index }}-evidence
          path: .audit-test-logs/foundry/
          include-hidden-files: true
          if-no-files-found: ignore

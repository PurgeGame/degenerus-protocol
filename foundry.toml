[profile.default]
src = "contracts"
test = "test"
out = "forge-out"
libs = ["node_modules", "lib"]
solc_version = "0.8.38"
auto_detect_solc = false
via_ir = true
optimizer = true
optimizer_runs = 1000
evm_version = "osaka"
# Emit storageLayout into every artifact so the storage-layout oracle
# (scripts/layout) inspects deterministically without hitting forge's
# "storage layout missing from artifact" incremental-cache gap. Metadata
# only — no effect on bytecode or contract sizes.
extra_output = ["storageLayout"]

# Per-test gas for integration tests and typed replays of long mining drains (the largest
# replay uses about 28B); the block gas limit matches.
gas_limit = 100_000_000_000
block_gas_limit = 100_000_000_000

# Pin block.timestamp so test setUp is DETERMINISTIC. Without this, the Foundry
# nightly defaults block.timestamp to the real wall clock, and a protocol
# constructor's day-arithmetic in _deployProtocol intermittently panics (0x11) at
# certain wall-clock seconds — a harness-wide flaky setUp. 86400 (= day 1) matches
# the DeployProtocol vm.warp(86400) / patchForFoundry.js fixed timestamp.
block_timestamp = 86400

# Read-only filesystem access scoped to ./contracts so structural attestation tests can
# vm.readFile the source (e.g. VrfWireOneShot greps DegenerusAdmin.sol for the single
# gameAdmin.initVrf( call site). No write access; no path outside ./contracts.
fs_permissions = [{ access = "read", path = "./contracts" }]

# Remappings for OpenZeppelin and forge-std
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "forge-std/=lib/forge-std/src/",
]

# Solidity formatting via `forge fmt`. line_length 120 matches the existing codebase (single-line
# signatures that fit) — VS Code should format .sol with forge fmt, NOT prettier-at-80 (which wraps
# every signature and churns the whole file on save). See .vscode/settings.json.
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

# Fuzz testing config
[fuzz]
runs = 1000
max_test_rejects = 65536
seed = "0xdeadbeef"

[invariant]
runs = 256
depth = 128
fail_on_revert = false
shrink_run_limit = 5000
show_metrics = true
dictionary_weight = 80
include_storage = true
include_push_bytes = true

# Fast inner-loop profile: skips via-IR (the bulk of compile time) for LOGIC
# iteration only. Gas numbers shift and via-IR-specific codegen is unexercised,
# so the default profile remains the pre-commit gate. Usage:
#   FOUNDRY_PROFILE=lite forge test --no-match-path 'test/gas/*' --match-path <suite>
[profile.lite]
via_ir = false
optimizer = false

# A deep campaign's end-of-run completion walk may make up to 12,000 calls at up to 30M gas
# each, past the default per-test gas.
[profile.deep]
gas_limit = 400_000_000_000
block_gas_limit = 400_000_000_000

[profile.deep.fuzz]
runs = 10000
max_test_rejects = 131072
seed = "0xdeadbeef"

[profile.deep.invariant]
runs = 1000
depth = 256
fail_on_revert = false
# Shrinking replays every candidate with its completion walk and can outlast a CI job;
# a failure reports its original sequence instead.
shrink_run_limit = 0
show_metrics = true
dictionary_weight = 80
include_storage = true
include_push_bytes = true

# CI schedules AdvanceLiveness as twenty independently seeded 50-run processes, each inside a
# hosted job's time limit.
# Local deep stays at 1000 runs; every CI process crosses its 48-run rare-coverage gate.
# The property also declares explicit inline settings for this profile because
# its inline default settings otherwise override inherited profile values.
[profile.deep_advance_ci]
gas_limit = 400_000_000_000
block_gas_limit = 400_000_000_000

[profile.deep_advance_ci.fuzz]
runs = 10000
max_test_rejects = 131072
seed = "0xdeadbeef"

[profile.deep_advance_ci.invariant]
runs = 50
depth = 256
fail_on_revert = false
shrink_run_limit = 0
show_metrics = true
dictionary_weight = 80
include_storage = true
include_push_bytes = true

# Halmos symbolic proofs need the via-IR build (the game facades hit stack-too-deep without it)
# but must not pull the whole test tree into one solc unit: only the halmos suites are compiled.
[profile.halmos]
out = "forge-out-halmos"
skip = ["test/access/**", "test/craps/**", "test/deploy/**", "test/differential/**", "test/economics/**", "test/edge/**", "test/fuzz/**", "test/gas/**", "test/governance/**", "test/integration/**", "test/invariant/**", "test/mutation/**", "test/repro/**", "test/stat/**", "test/unit/**", "test/validation/**"]
